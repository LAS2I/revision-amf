<title>Révision AMF</title>
<meta name="claude:viewport-fit-sides" content="cover">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&family=Space+Grotesk:wght@500;600;700&family=IBM+Plex+Mono:wght@400;500&display=swap">
<style>
/* Layout: one narrow column (max 560px), cartes d'action en grille 2 colonnes, barre d'action fixe en bas pendant les séries. */
:root{
  --bg:#F3F5F8; --surface:#FFFFFF; --ink:#141A2B; --muted:#5B6478; --line:#DCE1EA;
  --accent:#2F4BD8; --accent-ink:#FFFFFF; --accent-soft:#E6EAFC;
  --ok:#1C8A57; --ok-soft:#E1F4EA; --ko:#C4382F; --ko-soft:#FBE7E5; --warn:#B07209; --warn-soft:#FBF0DA;
  --catA:#7A3FC7; --catA-soft:#EFE6FA;
  --f-display:"Space Grotesk",ui-sans-serif,system-ui,sans-serif;
  --f-body:"Inter",ui-sans-serif,system-ui,-apple-system,"Segoe UI",sans-serif;
  --f-mono:"IBM Plex Mono",ui-monospace,SFMono-Regular,Menlo,monospace;
  --r:14px;
}
@media (prefers-color-scheme: dark){:root:not([data-theme="light"]){
  --bg:#0F1320; --surface:#181D2E; --ink:#E8EBF3; --muted:#9AA3B8; --line:#2A3147;
  --accent:#7D92FF; --accent-ink:#0F1320; --accent-soft:#232B4D;
  --ok:#4CC88C; --ok-soft:#173326; --ko:#FF7A70; --ko-soft:#3A1E1E; --warn:#F0B549; --warn-soft:#3A2D14;
  --catA:#B98CFF; --catA-soft:#2D2245; color-scheme:dark }}
:root[data-theme="dark"]{
  --bg:#0F1320; --surface:#181D2E; --ink:#E8EBF3; --muted:#9AA3B8; --line:#2A3147;
  --accent:#7D92FF; --accent-ink:#0F1320; --accent-soft:#232B4D;
  --ok:#4CC88C; --ok-soft:#173326; --ko:#FF7A70; --ko-soft:#3A1E1E; --warn:#F0B549; --warn-soft:#3A2D14;
  --catA:#B98CFF; --catA-soft:#2D2245; color-scheme:dark }
*{box-sizing:border-box}
body{background:var(--bg);color:var(--ink);font-family:var(--f-body);font-size:16px;line-height:1.5;-webkit-tap-highlight-color:transparent}
body::before{content:"";position:fixed;inset:0 0 auto;height:env(safe-area-inset-top,0px);z-index:10;background:var(--bg)}
button{font:inherit;color:inherit}
#app{max-width:560px;margin:0 auto;padding-left:max(16px,env(safe-area-inset-left,0px));padding-right:max(16px,env(safe-area-inset-right,0px));padding-block:12px 120px}
h1,h2,h3{font-family:var(--f-display);text-wrap:balance;margin:0;letter-spacing:-.01em}
h1{font-size:1.65rem;line-height:1.15}
h2{font-size:1.2rem}
h3{font-size:1rem}
.stack{display:flex;flex-direction:column;gap:12px}
.row{display:flex;gap:8px;align-items:center;flex-wrap:wrap}
.between{justify-content:space-between}
.muted{color:var(--muted)}
.small{font-size:.85rem}
.eyebrow{font-size:.72rem;letter-spacing:.08em;text-transform:uppercase;font-weight:600;color:var(--muted)}
.mono{font-family:var(--f-mono);font-size:.82rem}
.tnum{font-variant-numeric:tabular-nums}
.card{background:var(--surface);border:1px solid var(--line);border-radius:var(--r);padding:16px}
.topbar{position:sticky;top:env(safe-area-inset-top,0px);z-index:5;background:var(--bg);display:flex;align-items:center;gap:8px;padding-block:8px;margin-bottom:4px}
.iconbtn{border:1px solid var(--line);background:var(--surface);border-radius:999px;min-width:40px;height:40px;padding:0 12px;display:inline-flex;align-items:center;justify-content:center;gap:6px;cursor:pointer;font-size:.9rem}
.iconbtn:focus-visible,.btn:focus-visible,.opt:focus-visible,.tile:focus-visible,.chip:focus-visible,.theme:focus-visible{outline:3px solid var(--accent);outline-offset:2px}
.btn{border:0;border-radius:12px;padding:14px 18px;font-weight:600;cursor:pointer;background:var(--accent);color:var(--accent-ink);font-size:1rem;width:100%}
.btn.secondary{background:var(--surface);color:var(--ink);border:1px solid var(--line)}
.btn.ghost{background:transparent;color:var(--accent);padding:10px}
.btn.danger{background:var(--ko);color:#fff}
.btn:disabled{opacity:.45;cursor:default}
.grid2{display:grid;grid-template-columns:1fr 1fr;gap:10px}
.tile{background:var(--surface);border:1px solid var(--line);border-radius:var(--r);padding:14px;text-align:left;cursor:pointer;display:flex;flex-direction:column;gap:4px;min-width:0}
.tile b{font-family:var(--f-display);font-size:1.02rem}
.tile span{font-size:.82rem;color:var(--muted)}
.tile.hero{grid-column:1/-1;background:var(--accent);color:var(--accent-ink);border-color:transparent;padding:18px}
.tile.hero span{color:inherit;opacity:.85}
.tile.hero b{font-size:1.25rem}
.bar{height:8px;border-radius:99px;background:var(--line);overflow:hidden;display:flex}
.bar i{display:block;height:100%}
.bar .g{background:var(--ok)} .bar .r{background:var(--ko)}
.legend{display:flex;gap:14px;font-size:.8rem;color:var(--muted);flex-wrap:wrap}
.dot{display:inline-block;width:9px;height:9px;border-radius:50%;margin-right:5px;vertical-align:baseline}
.stats{display:grid;grid-template-columns:repeat(3,1fr);gap:8px}
.stat{display:flex;flex-direction:column;gap:2px;min-width:0}
.stat b{font-family:var(--f-display);font-size:1.45rem;font-variant-numeric:tabular-nums;line-height:1.1}
.stat span{font-size:.75rem;color:var(--muted)}
.theme{width:100%;background:var(--surface);border:1px solid var(--line);border-radius:var(--r);padding:14px;display:grid;grid-template-columns:34px 1fr auto;gap:4px 12px;align-items:center;text-align:left;cursor:pointer}
.theme .num{grid-row:1/3;width:34px;height:34px;border-radius:10px;background:var(--accent-soft);color:var(--accent);font-family:var(--f-display);font-weight:700;display:flex;align-items:center;justify-content:center}
.theme .name{font-weight:600;min-width:0}
.theme .pct{font-family:var(--f-display);font-variant-numeric:tabular-nums;font-weight:600}
.theme .bar{grid-column:2/4}
.chips{display:flex;flex-wrap:wrap;gap:8px}
.chip{border:1px solid var(--line);background:var(--surface);border-radius:999px;padding:8px 13px;font-size:.88rem;cursor:pointer}
.chip[aria-pressed="true"]{background:var(--accent);color:var(--accent-ink);border-color:var(--accent)}
.pill{display:inline-flex;align-items:center;border-radius:999px;padding:2px 9px;font-size:.72rem;font-weight:600;letter-spacing:.03em}
.pill.A{background:var(--catA-soft);color:var(--catA)}
.pill.C{background:var(--accent-soft);color:var(--accent)}
.pill.ok{background:var(--ok-soft);color:var(--ok)}
.pill.ko{background:var(--ko-soft);color:var(--ko)}
.progress{height:4px;background:var(--line);border-radius:4px;overflow:hidden}
.progress i{display:block;height:100%;background:var(--accent);transition:width .2s}
.qtext{font-size:1.12rem;font-weight:600;line-height:1.45}
.opts{display:flex;flex-direction:column;gap:10px}
.opt{display:grid;grid-template-columns:32px 1fr;gap:12px;align-items:start;text-align:left;width:100%;background:var(--surface);border:1.5px solid var(--line);border-radius:12px;padding:13px 14px;cursor:pointer;line-height:1.4}
.opt .k{width:32px;height:32px;border-radius:9px;border:1.5px solid var(--line);display:flex;align-items:center;justify-content:center;font-family:var(--f-display);font-weight:700}
.opt.sel{border-color:var(--accent);background:var(--accent-soft)}
.opt.sel .k{background:var(--accent);border-color:var(--accent);color:var(--accent-ink)}
.opt.good{border-color:var(--ok);background:var(--ok-soft)}
.opt.good .k{background:var(--ok);border-color:var(--ok);color:#fff}
.opt.bad{border-color:var(--ko);background:var(--ko-soft)}
.opt.bad .k{background:var(--ko);border-color:var(--ko);color:#fff}
.opt[disabled]{cursor:default}
.feedback{border-radius:12px;padding:12px 14px;display:flex;flex-direction:column;gap:4px}
.feedback.ok{background:var(--ok-soft)} .feedback.ko{background:var(--ko-soft)}
.feedback b{font-family:var(--f-display)}
.feedback.ok b{color:var(--ok)} .feedback.ko b{color:var(--ko)}
.actionbar{position:fixed;left:0;right:0;bottom:0;z-index:6;background:var(--bg);border-top:1px solid var(--line);padding-top:10px;padding-bottom:calc(10px + env(safe-area-inset-bottom,0px));padding-left:max(16px,env(safe-area-inset-left,0px));padding-right:max(16px,env(safe-area-inset-right,0px))}
.actionbar .inner{max-width:560px;margin:0 auto;display:flex;gap:10px}
.actionbar .btn{flex:1}
.star{font-size:1.15rem;line-height:1}
.star[aria-pressed="true"]{color:var(--warn);border-color:var(--warn)}
.navgrid{display:grid;grid-template-columns:repeat(auto-fill,minmax(44px,1fr));gap:6px}
.navgrid button{height:40px;border-radius:9px;border:1px solid var(--line);background:var(--surface);font-size:.85rem;font-variant-numeric:tabular-nums;cursor:pointer}
.navgrid button.done{background:var(--accent-soft);border-color:var(--accent);color:var(--accent)}
.navgrid button.cur{outline:2px solid var(--ink);outline-offset:1px}
.navgrid button.good{background:var(--ok-soft);border-color:var(--ok);color:var(--ok)}
.navgrid button.bad{background:var(--ko-soft);border-color:var(--ko);color:var(--ko)}
.sheet{position:fixed;inset:0;z-index:20;background:rgba(10,14,25,.5);display:flex;align-items:flex-end;justify-content:center}
.sheet .panel{background:var(--surface);width:100%;max-width:560px;max-height:85%;overflow:auto;border-radius:18px 18px 0 0;padding:18px;padding-left:max(18px,env(safe-area-inset-left,0px));padding-right:max(18px,env(safe-area-inset-right,0px));padding-bottom:calc(18px + env(safe-area-inset-bottom,0px));display:flex;flex-direction:column;gap:14px}
.verdict{border-radius:var(--r);padding:20px;display:flex;flex-direction:column;gap:6px}
.verdict.ok{background:var(--ok-soft)} .verdict.ko{background:var(--ko-soft)}
.verdict h1{font-size:1.5rem}
.verdict.ok h1{color:var(--ok)} .verdict.ko h1{color:var(--ko)}
.scoreline{display:grid;grid-template-columns:auto 1fr auto;gap:10px;align-items:center}
.scoreline .bar{height:10px;position:relative;overflow:visible}
.scoreline .bar i{border-radius:99px}
.threshold{position:absolute;top:-4px;bottom:-4px;width:2px;background:var(--ink);left:80%}
.review{display:flex;flex-direction:column;gap:6px}
.review .ans{font-size:.92rem;padding:6px 10px;border-radius:8px}
.review .ans.good{background:var(--ok-soft)} .review .ans.bad{background:var(--ko-soft);text-decoration:line-through;text-decoration-thickness:1px}
.hist{display:grid;grid-template-columns:1fr auto auto;gap:4px 12px;align-items:center;font-size:.9rem}
.toast{position:fixed;left:50%;transform:translateX(-50%);bottom:calc(90px + env(safe-area-inset-bottom,0px));background:var(--ink);color:var(--bg);padding:10px 16px;border-radius:999px;font-size:.88rem;z-index:30;max-width:calc(100% - 32px)}
.loading{padding:60px 0;text-align:center;color:var(--muted)}
.seg{display:grid;grid-auto-flow:column;grid-auto-columns:1fr;background:var(--line);border-radius:11px;padding:3px;gap:3px}
.seg button{border:0;background:transparent;border-radius:9px;padding:9px 4px;font-size:.88rem;cursor:pointer}
.seg button[aria-pressed="true"]{background:var(--surface);font-weight:600;box-shadow:0 1px 2px rgba(0,0,0,.08)}
hr{border:0;border-top:1px solid var(--line);margin:4px 0;width:100%}
@media (prefers-reduced-motion: reduce){*{transition:none!important}}
</style>

<div id="app"><div class="loading">Chargement des questions…</div></div>
<div id="layer"></div>

<script>
(function(){
"use strict";
const THEMES={1:"Cadre institutionnel et réglementaire",2:"Déontologie et conformité",3:"Sécurité financière (LCB-FT)",4:"Abus de marché",5:"Commercialisation et démarchage",6:"Relation et information client",7:"Instruments financiers et risques",8:"Gestion pour compte de tiers",9:"Fonctionnement des marchés",10:"Post-marché et infrastructures",11:"Émissions et opérations sur titres",12:"Bases comptables et financières"};
const EXAM={n:120,a:33,c:87,minutes:120,pass:0.8};
const LS_P="amf.progress.v1", LS_S="amf.session.v1";
const $app=document.getElementById("app"), $layer=document.getElementById("layer");
let Q=[], byId=new Map();
let P={v:1,t:0,s:{},fav:[],exams:[]};
let S=null; // current session
let view="home", viewArg=null, timerInt=null;
let sync={state:"local",db:null,uid:null,pending:false,busy:false,timer:null};

// ---------- utils
const esc=s=>String(s).replace(/[&<>"']/g,c=>({"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;","'":"&#39;"}[c]));
const L="ABC";
function shuffle(a){a=a.slice();for(let i=a.length-1;i>0;i--){const j=Math.floor(Math.random()*(i+1));[a[i],a[j]]=[a[j],a[i]]}return a}
function lsGet(k){try{const v=localStorage.getItem(k);return v?JSON.parse(v):null}catch(e){return null}}
function lsSet(k,v){try{if(v===null)localStorage.removeItem(k);else localStorage.setItem(k,JSON.stringify(v))}catch(e){}}
function fmtTime(sec){sec=Math.max(0,Math.round(sec));const h=Math.floor(sec/3600),m=Math.floor(sec%3600/60),s=sec%60;return (h?h+":"+String(m).padStart(2,"0"):m)+":"+String(s).padStart(2,"0")}
function fmtDate(t){try{return new Date(t).toLocaleDateString("fr-FR",{day:"numeric",month:"short"})+" · "+new Date(t).toLocaleTimeString("fr-FR",{hour:"2-digit",minute:"2-digit"})}catch(e){return ""}}
function pct(a,b){return b?Math.round(a/b*100):0}
function toast(msg){const d=document.createElement("div");d.className="toast";d.textContent=msg;document.body.appendChild(d);setTimeout(()=>d.remove(),2200)}
function nf(n){return n.toLocaleString("fr-FR")}

// ---------- progress
function stat(id){return P.s[id]}
function record(id,ok){const s=P.s[id]||[0,0,0];if(ok)s[0]++;else s[1]++;s[2]=ok?1:0;P.s[id]=s}
function saveP(){P.t=Date.now();lsSet(LS_P,P);queueRemote()}
function saveS(){lsSet(LS_S,S)}
function isFav(id){return P.fav.includes(id)}
function toggleFav(id){const i=P.fav.indexOf(id);if(i>=0)P.fav.splice(i,1);else P.fav.push(id);saveP()}
function summary(list){let seen=0,ok=0,ko=0;for(const q of list){const s=P.s[q.id];if(s){seen++;if(s[2])ok++;else ko++}}return{total:list.length,seen,ok,ko}}

// ---------- remote sync (compte claude.ai)
function queueRemote(){if(!sync.db)return;sync.pending=true;clearTimeout(sync.timer);sync.timer=setTimeout(flushRemote,2500)}
async function flushRemote(){
  if(!sync.db||sync.busy||!sync.pending)return;
  sync.busy=true;sync.pending=false;
  try{await sync.db.doc("data/users/"+sync.uid+"/progress").set(JSON.parse(JSON.stringify(P)));sync.state="synced"}
  catch(e){sync.state="error";if(e&&e.code==="unavailable")sync.pending=true}
  sync.busy=false;
  if(sync.pending)sync.timer=setTimeout(flushRemote,5000);
}
async function initSync(){
  try{
    if(!window.claude||!window.claude.use)return;
    const user=await window.claude.use("user");const db=await window.claude.use("db");
    if(!user||!db)return;
    const uid=await user.id();if(!uid)return;
    sync.db=db;sync.uid=uid;
    const snap=await db.doc("data/users/"+uid+"/progress").get();
    if(snap.exists){const r=snap.data();
      if(r&&r.v===1&&(r.t||0)>(P.t||0)){P={v:1,t:r.t,s:Object.assign({},r.s),fav:(r.fav||[]).slice(),exams:(r.exams||[]).slice()};lsSet(LS_P,P);if(view==="home"||view==="themes"||view==="settings")render()}
      else if((P.t||0)>(r.t||0)){sync.pending=true;flushRemote()}
    }else if(P.t){sync.pending=true;flushRemote()}
    sync.state="synced";
    if(view==="settings")render();
  }catch(e){sync.db=null;sync.state="local"}
}

// ---------- session builders
function pickExam(n){
  // tirage proportionnel par thème dans chaque catégorie, comme l'examen réel (33 A + 87 C pour 120)
  const nA=Math.round(n*EXAM.a/EXAM.n), nC=n-nA;
  const out=[];
  for(const [cat,k] of [["A",nA],["C",nC]]){
    const pool=Q.filter(q=>q.c===cat), groups={};
    pool.forEach(q=>(groups[q.t]=groups[q.t]||[]).push(q));
    const keys=Object.keys(groups);
    const quotas=keys.map(t=>({t,ex:groups[t].length/pool.length*k}));
    quotas.forEach(x=>x.n=Math.floor(x.ex));
    let rest=k-quotas.reduce((a,x)=>a+x.n,0);
    quotas.slice().sort((a,b)=>(b.ex-b.n)-(a.ex-a.n)).slice(0,rest).forEach(x=>x.n++);
    quotas.forEach(x=>out.push(...shuffle(groups[x.t]).slice(0,x.n)));
  }
  return out.sort((a,b)=>a.t-b.t||a.id-b.id).map(q=>q.id);
}
function startSession(o){
  S=Object.assign({i:0,ans:{},done:false,started:Date.now(),elapsed:0},o);
  if(!S.ids.length){toast("Aucune question ne correspond à ce choix.");return}
  saveS();go(S.mode==="exam"?"exam":"quiz");
}

// ---------- navigation
function go(v,arg){view=v;viewArg=arg===undefined?null:arg;closeSheet();render();window.scrollTo(0,0)}
function render(){
  clearInterval(timerInt);timerInt=null;
  const f={home:vHome,themes:vThemes,theme:vTheme,quiz:vQuiz,exam:vExam,result:vResult,review:vReview,settings:vSettings,exams:vExamPick,random:vRandom}[view]||vHome;
  $app.innerHTML=f();
  bind();
  if(view==="exam")startTimer();
}
function bind(){
  $app.querySelectorAll("[data-act]").forEach(el=>el.addEventListener("click",e=>{e.preventDefault();act(el.dataset.act,el.dataset,el)}));
}
function closeSheet(){$layer.innerHTML=""}
function sheet(html){
  $layer.innerHTML='<div class="sheet" data-close="1"><div class="panel" role="dialog" aria-modal="true">'+html+'</div></div>';
  const sh=$layer.firstChild;
  sh.addEventListener("click",e=>{if(e.target===sh)closeSheet()});
  sh.querySelectorAll("[data-act]").forEach(el=>el.addEventListener("click",e=>{e.preventDefault();act(el.dataset.act,el.dataset,el)}));
}
function confirmSheet(title,text,label,actName,danger){
  sheet('<h2>'+esc(title)+'</h2><p class="muted" style="margin:0">'+esc(text)+'</p><div class="stack"><button class="btn '+(danger?"danger":"")+'" data-act="'+actName+'">'+esc(label)+'</button><button class="btn secondary" data-act="closeSheet">Annuler</button></div>');
}

// ---------- views
function topbar(title,back){
  return '<div class="topbar">'+(back?'<button class="iconbtn" data-act="go" data-v="'+back+'" aria-label="Retour">←</button>':'')+'<h2 style="flex:1;min-width:0">'+esc(title)+'</h2></div>';
}
function bar(ok,ko,total){return '<div class="bar" role="img" aria-label="'+ok+' réussies, '+ko+' à revoir sur '+total+'"><i class="g" style="width:'+(ok/total*100)+'%"></i><i class="r" style="width:'+(ko/total*100)+'%"></i></div>'}

function vHome(){
  const all=summary(Q), errors=Q.filter(q=>P.s[q.id]&&!P.s[q.id][2]).length;
  const A=summary(Q.filter(q=>q.c==="A")), C=summary(Q.filter(q=>q.c==="C"));
  let h='<div class="stack">';
  h+='<div class="row between" style="padding-block:6px 2px"><div><div class="eyebrow">Certification AMF</div><h1>Révision AMF</h1></div><button class="iconbtn" data-act="go" data-v="settings" aria-label="Réglages">⚙︎</button></div>';
  if(S&&!S.done){
    const n=Object.keys(S.ans).length;
    h+='<button class="tile" data-act="resume" style="border-color:var(--accent)"><span class="eyebrow" style="color:var(--accent)">En cours</span><b>'+esc(S.title)+'</b><span>'+n+' / '+S.ids.length+' réponses'+(S.mode==="exam"?' · '+fmtTime(S.limit-(S.strict?(Date.now()-S.started)/1000:S.elapsed))+' restantes'+(S.strict?' (le chrono tourne)':''):'')+' · touche pour reprendre</span></button>';
  }
  h+='<div class="grid2">';
  h+='<button class="tile hero" data-act="go" data-v="exams"><b>Examen blanc</b><span>En conditions réelles : 120 questions tirées de toute la base, 2 h, correction à la fin</span></button>';
  h+='<button class="tile" data-act="go" data-v="themes"><b>Par thème</b><span>12 thèmes, sous-thèmes au choix</span></button>';
  h+='<button class="tile" data-act="go" data-v="random"><b>Série aléatoire</b><span>De 10 à 100 questions, tu choisis</span></button>';
  h+='<button class="tile" data-act="errors"'+(errors?'':' disabled style="opacity:.55"')+'><b>Mes erreurs</b><span>'+(errors?errors+' question'+(errors>1?'s':'')+' à revoir':'Rien à revoir pour l’instant')+'</span></button>';
  h+='<button class="tile" data-act="favs"'+(P.fav.length?'':' disabled style="opacity:.55"')+'><b>Favoris ★</b><span>'+(P.fav.length?P.fav.length+' marquée'+(P.fav.length>1?'s':''):'Marque une question avec ★')+'</span></button>';
  h+='</div>';
  h+='<div class="card stack"><div class="row between"><h3>Ma progression</h3><span class="muted small tnum">'+nf(all.total)+' questions</span></div>';

function act(a,d){
  switch(a){
    case "go": go(d.v,d.arg); break;
    case "home": go("home"); break;
    case "closeSheet": closeSheet(); break;
    case "resume": go(S.mode==="exam"?"exam":"quiz"); break;
    case "errors": startSession({mode:"practice",title:"Mes erreurs",ids:shuffle(Q.filter(q=>P.s[q.id]&&!P.s[q.id][2])).slice(0,40).map(q=>q.id)}); break;
    case "favs": startSession({mode:"practice",title:"Favoris",ids:shuffle(P.fav.filter(id=>byId.has(id)))}); break;
    case "exam": {const n=+d.n,strict=d.strict==="1";startSession({mode:"exam",strict,title:strict?"Examen blanc · conditions réelles":n===120?"Examen blanc complet":n===60?"Demi-examen blanc":"Examen express",ids:strict?shuffle(pickExam(n)):pickExam(n),limit:n*60}); break}
    case "rcount": rcfg.count=+d.n;render();break;
    case "rfilter": rcfg.filter=d.k;render();break;
    case "rcat": rcfg.cat=d.k;render();break;
    case "startRandom": startSession({mode:"practice",title:"Série aléatoire · "+Math.min(rcfg.count,randomPool().length)+" questions",ids:shuffle(randomPool()).slice(0,rcfg.count).map(q=>q.id)});break;
    case "sub": {if(!d.s)cfg.sub=[];else{const i=cfg.sub.indexOf(d.s);if(i>=0)cfg.sub.splice(i,1);else cfg.sub.push(d.s)}render();break}
    case "filter": cfg.filter=d.k;render();break;
    case "cat": cfg.cat=d.k;render();break;
    case "count": cfg.count=+d.n;render();break;
    case "startTheme": {const t=+viewArg,pool=shuffle(themePool(t));startSession({mode:"practice",title:"Thème "+t+" · "+THEMES[t],ids:(cfg.count?pool.slice(0,cfg.count):pool).map(q=>q.id)});break}
    case "answer": {
      const k=+d.k;
      if(S.mode==="exam"){S.ans[S.i]=k;saveS();render();}
      else{if(S.ans[S.i]!==undefined)return;S.ans[S.i]=k;record(curQ().id,k===curQ().a);saveP();saveS();render();
        const fb=$app.querySelector(".feedback");if(fb)fb.scrollIntoView({block:"nearest",behavior:"smooth"})}
      break}
    case "next": if(S.i<S.ids.length-1){S.i++;saveS();render();window.scrollTo(0,0)}else finishPractice(); break;
    case "skip": if(S.i<S.ids.length-1){S.i++;saveS();render();window.scrollTo(0,0)}else finishPractice(); break;
    case "enext": if(S.i<S.ids.length-1){S.i++;saveS();render();window.scrollTo(0,0)} break;
    case "prev": if(S.i>0){S.i--;saveS();render();window.scrollTo(0,0)} break;
    case "fav": toggleFav(curQ().id);render();break;
    case "favId": {toggleFav(+d.id);const y=window.scrollY;render();window.scrollTo(0,y);break}
    case "grid": {
      let g='<div class="row between"><h2>Vue d’ensemble</h2><button class="iconbtn" data-act="closeSheet" aria-label="Fermer">✕</button></div><p class="muted small" style="margin:0">'+Object.keys(S.ans).length+' / '+S.ids.length+' réponses. Touche un numéro pour y aller.</p><div class="navgrid">';
      S.ids.forEach((id,i)=>{g+='<button class="'+(S.ans[i]!==undefined?'done ':'')+(i===S.i?'cur':'')+'" data-act="jump" data-i="'+i+'">'+(i+1)+'</button>'});
      g+='</div><button class="btn" data-act="finishAsk">Terminer l’examen</button>';sheet(g);break}
    case "jump": S.i=+d.i;saveS();closeSheet();render();window.scrollTo(0,0);break;
    case "finishAsk": {const left=S.ids.length-Object.keys(S.ans).length;confirmSheet("Terminer l’examen ?",left?left+" question"+(left>1?"s":"")+" sans réponse, elles compteront comme fausses.":"Toutes les questions ont une réponse.","Terminer et voir ma note","finish");break}
    case "finish": closeSheet();finishExam();break;
    case "quit": {
      if(S.mode==="exam")sheet('<h2>Quitter l’examen ?</h2><p class="muted" style="margin:0">'+(S.strict?'Comme le jour J, le chrono continue de tourner même si tu quittes. Tu peux revenir depuis l’accueil tant qu’il reste du temps.':'Tu peux le reprendre plus tard depuis l’accueil, le chrono est mis en pause.')+'</p><div class="stack"><button class="btn" data-act="home">'+(S.strict?'Revenir plus tard':'Mettre en pause')+'</button><button class="btn danger" data-act="abandon">Abandonner l’examen</button><button class="btn secondary" data-act="closeSheet">Continuer</button></div>');
      else if(Object.keys(S.ans).length)finishPractice();else{S=null;saveS();go("home")}
      break}
    case "abandon": S=null;saveS();go("home");break;
    case "redoWrong": {const ids=S.ids.filter((id,i)=>S.ans[i]!==byId.get(id).a);startSession({mode:"practice",title:"Questions ratées",ids:shuffle(ids)});break}
    case "exportP": {const txt=JSON.stringify(P);const box=document.getElementById("importBox");
      const fallback=()=>{box.value=txt;box.select();toast("Sauvegarde affichée : copie-la avec ton téléphone")};
      try{navigator.clipboard.writeText(txt).then(()=>toast("Sauvegarde copiée"),fallback)}catch(e){fallback()};break}
    case "importP": {let r=null;try{r=JSON.parse(document.getElementById("importBox").value.trim())}catch(e){}
      if(!r||r.v!==1||typeof r.s!=="object"){toast("Ce texte n’est pas une sauvegarde valide");break}
      P={v:1,t:Date.now(),s:r.s,fav:r.fav||[],exams:r.exams||[]};saveP();toast("Progression importée");go("home");break}
    case "resetAsk": confirmSheet("Effacer ta progression ?","Toutes tes réponses, tes favoris et ton historique d’examens seront supprimés. Les questions restent.","Tout effacer","reset",true);break;
    case "reset": P={v:1,t:Date.now(),s:{},fav:[],exams:[]};S=null;saveS();saveP();closeSheet();toast("Progression effacée");go("home");break;
  }
}
document.addEventListener("keydown",e=>{
  if((view!=="quiz"&&view!=="exam")||!S||$layer.innerHTML)return;
  const k={a:0,b:1,c:2,"1":0,"2":1,"3":2}[e.key.toLowerCase()];
  if(k!==undefined)act("answer",{k});
  else if(e.key==="ArrowRight"||e.key==="Enter"){if(view==="quiz"&&S.ans[S.i]!==undefined)act("next",{});else if(view==="exam")act("enext",{})}
  else if(e.key==="ArrowLeft")act("prev",{});
});
document.addEventListener("visibilitychange",()=>{if(document.visibilityState==="hidden"){if(S)saveS();flushRemote()}});

// ---------- boot
(async function boot(){
  const lp=lsGet(LS_P);if(lp&&lp.v===1)P=Object.assign({v:1,t:0,s:{},fav:[],exams:[]},lp);
  const ls=lsGet(LS_S);if(ls&&ls.ids&&!ls.done)S=ls;
  try{
    const r=await fetch("questions.json");if(!r.ok)throw new Error(r.status);
    Q=await r.json();Q.forEach(q=>byId.set(q.id,q));
    if(S&&!S.ids.every(id=>byId.has(id)))S=null;
    render();
  }catch(e){$app.innerHTML='<div class="loading">Impossible de charger les questions. Vérifie ta connexion puis recharge la page.</div>';return}
  initSync();
})();
// version installable : active le mode hors ligne quand l'appli est servie depuis son propre site
try{if("serviceWorker" in navigator&&(location.protocol==="https:"||location.hostname==="localhost")&&!/claude\.ai|claudeusercontent/.test(location.hostname))navigator.serviceWorker.register("sw.js").catch(()=>{})}catch(e){}
})();
</script>
